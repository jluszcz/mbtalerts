[package]
name = "mbtalerts"
authors = ["Jacob Luszcz"]
version = "0.1.0"
edition = "2024"
default-run = "mbtalerts"

[[bin]]
name = "mbtalerts"
path = "src/main.rs"

[[bin]]
name = "lambda"
path = "src/lambda.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
gcp_auth = "0.12"
jluszcz_rust_utils = { git = "https://github.com/jluszcz/rust-utils", features = ["bedrock", "cli", "lambda", "query"] }
lambda_runtime = "1"
log = "0.4"
reqwest = { version = "0.13", features = ["gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
